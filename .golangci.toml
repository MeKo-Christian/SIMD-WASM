version = '2'

[linters]
default = 'all'
disable = [
  'depguard',
  'exhaustive',
  'exhaustruct',
  'godox',
  'gomodguard',
  'ireturn',
  'mnd',
  'musttag',
  'nlreturn',
  'sqlclosecheck',
  'wsl',
]
enable = ['gomodguard_v2', 'wsl_v5']

[linters.settings]
[linters.settings.varnamelen]
ignore-names = ['n', 'x', 'y', 'p', 'a', 'b', 'i', 's', 'v', 'f', 'ok']
ignore-decls = ['w http.ResponseWriter', 'r *http.Request']

[linters.settings.wsl_v5]
allow-first-in-block = true
allow-whole-block = false
branch-max-lines = 3
disable = ['decl', 'assign']

[linters.exclusions]
generated = 'lax'
presets = ['comments', 'common-false-positives', 'legacy', 'std-error-handling']
paths = ['third_party$', 'builtin$', 'examples$']

# The demo program at the repo root is a CLI: printing is its output, its
# random test data needs no crypto, and the benchmark sink must be a global.
[[linters.exclusions.rules]]
linters = ['forbidigo', 'gochecknoglobals', 'gochecknoinits']
path = '^(main|grow)\.go$'

[[linters.exclusions.rules]]
linters = ['gosec']
text = 'G404:'
path = '^main\.go$'

# Lengths are computed on the Go side and always fit; see simd/kernels_wasm.go.
[[linters.exclusions.rules]]
linters = ['gosec']
text = 'G115:'
path = 'simd/kernels_wasm\.go'

# The tests deliberately live in package simd: they exercise the internal
# dispatch, not just the exported API.
[[linters.exclusions.rules]]
linters = ['testpackage']
path = 'simd/.*_test\.go'

[[linters.exclusions.rules]]
linters = ['forbidigo', 'gochecknoglobals', 'gochecknoinits']
path = 'cmd/.*\.go'

[[linters.exclusions.rules]]
linters = ['err113', 'wrapcheck']
path = 'cmd/.*\.go'

[severity]
default = 'warn'

[[severity.rules]]
linters = ['exhaustive', 'exhaustruct', 'godox']
severity = 'info'

[formatters]
enable = ['gci', 'gofumpt', 'goimports']

[formatters.exclusions]
generated = 'lax'
paths = ['third_party$', 'builtin$', 'examples$']
