name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: extractions/setup-just@v3

      # clang supplies the wasm32 target, lld supplies wasm-ld.
      - name: Install clang and wasm-ld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld shellcheck

      - name: Install formatters and linters
        run: just setup-deps

      - name: Toolchain versions
        run: just tools

      # gofmt/gci formatting check, golangci-lint natively and under the wasm
      # build tags, go vet both ways, the native tests, a full build, the wasm
      # content assertions, and the GOOS=js demo.
      - name: just ci
        run: just ci
