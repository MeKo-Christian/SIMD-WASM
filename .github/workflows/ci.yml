name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # clang supplies the wasm32 target, lld supplies wasm-ld.
      - name: Install clang and wasm-ld
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Toolchain versions
        run: |
          go version
          clang --version | head -1
          wasm-ld --version
          node --version

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: go vet (native)
        run: go vet ./...

      # Also vets the //go:wasmimport declarations, which only exist under the
      # wasm build tags.
      - name: go vet (wasip1, gosimd)
        run: GOOS=wasip1 GOARCH=wasm go vet -tags gosimd ./...

      - name: go test (pure-Go fallback)
        run: go test -v ./simd/

      - name: Build kernel and all app variants
        run: ./build.sh

      - name: Kernel really contains SIMD
        run: |
          grep -qa simd128 build/kernel.wasm \
            || { echo "kernel.wasm lacks the simd128 target feature"; exit 1; }

      # These exit non-zero if any correctness check fails.
      - name: Run wasip1 with SIMD kernels
        run: node host/run.mjs build/app-simd.wasm | tee /tmp/simd.out

      - name: Kernels were actually linked, not silently skipped
        run: |
          grep -q "SIMD kernels linked: true" /tmp/simd.out

      - name: Run wasip1 pure-Go fallback
        run: |
          node host/run.mjs build/app-plain.wasm --no-kernel | tee /tmp/plain.out
          grep -q "SIMD kernels linked: false" /tmp/plain.out

      - name: Fallback build has no extra imports
        run: |
          if grep -qa gosimd build/app-plain.wasm; then
            echo "untagged build should not import the gosimd module"; exit 1
          fi

      - name: Run GOOS=js under Node
        run: node host/run-js.mjs
