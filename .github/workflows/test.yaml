name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-format:
    uses: ./.github/workflows/test-format.yaml

  test-lint:
    uses: ./.github/workflows/test-lint.yaml

  test-unit:
    uses: ./.github/workflows/test-unit.yaml

  test-build:
    uses: ./.github/workflows/test-build.yaml

  test-demo:
    uses: ./.github/workflows/test-demo.yaml
